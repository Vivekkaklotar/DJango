<!-- templates/navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="#">Flipkart Clone</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <span class="nav-item nav-link text-white me-3">Welcome, <strong>{{ user.username }}</strong>!</span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Login</a>
                <a class="nav-link" href="{% url 'signup' %}">Signup</a>
            {% endif %}
        </div>
    </div>
</nav>
