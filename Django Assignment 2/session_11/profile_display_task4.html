<!-- templates/profile/view_profile.html -->
<div class="card text-center p-4">
    {% if profile.profile_pic %}
        <img src="{{ profile.profile_pic.url }}" class="rounded-circle mx-auto" width="150" height="150" alt="Profile Picture">
    {% else %}
        <img src="/static/images/default_avatar.png" class="rounded-circle mx-auto" width="150" height="150" alt="Default Avatar">
    {% endif %}
    <h3 class="mt-3">{{ profile.display_name }}</h3>
    <p class="text-muted">{{ profile.bio }}</p>
</div>
